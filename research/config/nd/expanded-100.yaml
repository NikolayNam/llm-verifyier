transports:
    local-compatible:
        provider: compatible
        base_url: http://localhost:11434
families:
    nd-expanded-100-main:
        transport: local-compatible
        experiment_name: formal-mode
        models:
            - gpt-oss:20b
            - gpt-oss:120b-cloud
            - glm-5:cloud
            - deepseek-v3.1:671b-cloud
        sampling:
            seed: 42
            top_p: 1
benchmarks:
    nd:
        input_file: theorems/pilot_shared_20260327-expanded-100.csv
        prompt_version: hilbert-ai-verification-benchmark-nd-v1.1
        families:
            - nd-expanded-100-main
        repeats: 5
        request_timeout_abort_threshold: 10
        interrupt_policy: drop_if_no_results
        summary_dir: research/artifacts/result_research/nd
        report_dir: research/result_research_report_v1/nd
