transports:
  local-compatible:
    provider: compatible
    base_url: http://localhost:11434

families:
  phase1-next-cycle-main:
    transport: local-compatible
    experiment_name: formal-mode
    models:
      - gpt-oss:20b
      - gpt-oss:120b-cloud
      - glm-5:cloud
      - deepseek-v3.1:671b-cloud
    sampling:
      temperature: 0
      seed: 42
      top_p: 1

benchmarks:
  phase1:
    input_file: cases/negative-refusal-sanity.csv
    families:
      - phase1-next-cycle-main
    repeats: 5
    request_timeout_abort_threshold: 5
    interrupt_policy: drop_if_no_results
