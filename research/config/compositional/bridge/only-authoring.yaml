transports:
  local-compatible:
    provider: compatible
    base_url: http://localhost:11434

families:
  bridge-only-authoring-main:
    transport: local-compatible
    experiment_name: bridge-only-authoring-v1
    models:
      - gpt-oss:20b
      - gpt-oss:120b-cloud
      - glm-5:cloud
      - deepseek-v3.1:671b-cloud
    sampling:
      temperature: 0
      seed: 42
      top_p: 1

benchmarks:
  bridge_only_authoring:
    input_file: cases/bridge-only-authoring-phase1.csv
    prompt_version: hilbert-ai-verification-bridge-only-v1.0
    families:
      - bridge-only-authoring-main
    repeats: 5
    request_timeout_abort_threshold: 5
    interrupt_policy: drop_if_no_results
    summary_dir: research/artifacts/result_research/bridge-only-authoring
    report_dir: research/result_research_report_v1/bridge-only-authoring
