transports:
  local-compatible:
    provider: compatible
    base_url: http://localhost:11434

families:
  gold-final-composition-only-phase2-main:
    transport: local-compatible
    experiment_name: gold-final-composition-only-v2
    models:
      - gpt-oss:20b
      - gpt-oss:120b-cloud
      - glm-5:cloud
      - deepseek-v3.1:671b-cloud
    sampling:
      temperature: 0
      seed: 42
      top_p: 1

benchmarks:
  gold_final_composition_only:
    input_file: cases/gold-final-composition-only-phase2.csv
    prompt_version: hilbert-ai-verification-gold-final-only-v1.0
    families:
      - gold-final-composition-only-phase2-main
    repeats: 5
    request_timeout_abort_threshold: 5
    interrupt_policy: drop_if_no_results
    summary_dir: research/artifacts/result_research/gold-final-composition-only
    report_dir: research/result_research_report_v1/gold-final-composition-only
